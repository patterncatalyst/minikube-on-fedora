<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="30" y="30" width="380" height="330" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="42" y="50" font-size="12" font-weight="700" fill="#888">minikube image build</text>
<rect x="460" y="30" width="390" height="330" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="472" y="50" font-size="12" font-weight="700" fill="#888">Kaniko (a real Kubernetes object)</text>
<rect x="60" y="80" width="320" height="70" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="220.0" y="113.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">minikube CLI (host)</text>
<text x="220.0" y="130.0" font-size="11.5" fill="#555555" text-anchor="middle">ships build context to the node</text>
<rect x="60" y="190" width="320" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="220.0" y="223.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">node&#x27;s containerd</text>
<text x="220.0" y="240.0" font-size="11.5" fill="#555555" text-anchor="middle">builds and stores the image locally</text>
<rect x="60" y="290" width="320" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="220.0" y="320.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">no Pod, no Job, nothing kubectl shows</text>
<rect x="490" y="80" width="330" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="655.0" y="113.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Kaniko Job (a Pod)</text>
<text x="655.0" y="130.0" font-size="11.5" fill="#555555" text-anchor="middle">builds the Containerfile in-cluster</text>
<rect x="490" y="190" width="330" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="655.0" y="223.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">in-cluster registry</text>
<text x="655.0" y="240.0" font-size="11.5" fill="#555555" text-anchor="middle">registry.kube-system.svc.cluster.local</text>
<rect x="490" y="290" width="330" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="655.0" y="318.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">node pulls via localhost:5000</text>
<text x="655.0" y="335.0" font-size="11.5" fill="#555555" text-anchor="middle">registry-proxy DaemonSet, same node</text>
<path d="M220,150 L220,190" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="226.0" y="164.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">build</text>
<text x="226.0" y="164.0" font-size="11" fill="#555" text-anchor="middle">build</text>
<path d="M655,150 L655,190" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="661.0" y="164.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">push (pod network)</text>
<text x="661.0" y="164.0" font-size="11" fill="#b8650a" text-anchor="middle">push (pod network)</text>
<path d="M655,260 L655,290" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="661.0" y="269.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">pull (node network)</text>
<text x="661.0" y="269.0" font-size="11" fill="#b8650a" text-anchor="middle">pull (node network)</text>
<text x="220" y="405" font-size="13" fill="#888" text-anchor="middle">Fastest in-cluster-ish build, but invisible to the Kubernetes API</text>
<text x="655" y="405" font-size="13" fill="#888" text-anchor="middle">Push and pull use two addresses for one registry: a Pod&#x27;s network and the node&#x27;s are not the same</text>
</svg>