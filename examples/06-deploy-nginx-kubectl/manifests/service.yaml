apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
  - port: 80
    targetPort: 8080
    # Published to 127.0.0.1:18080 when the minikube profile is created
    # (--ports=127.0.0.1:18080:30080). Shared slot with §8, §9, §12-http.
    nodePort: 30080
    protocol: TCP
