# inventory-service with all three probe types plus a readiness gate.
# /health (liveness) only confirms the process is up; /healthz (readiness)
# confirms Postgres is reachable. The readiness gate adds a condition no probe
# can satisfy on its own: something external has to patch the Pod's status.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: patterns
  labels:
    app.kubernetes.io/name: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-service
    spec:
      readinessGates:
        - conditionType: "patterns.example.com/InventorySeeded"
      containers:
        - name: inventory-service
          image: inventory-service:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 50051
          env:
            - name: SERVICE_SCHEMA
              value: inventory
            - name: PG_HOST
              value: patterns-postgres.patterns.svc.cluster.local
            - name: PG_PORT
              value: "5432"
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: password
            - name: PG_DATABASE
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: dbname
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          # Startup probe: 30 attempts x 2s = 60s grace before liveness/readiness
          # start counting. Schema creation + seeding + the gRPC bind all happen
          # during FastAPI's startup, before /health answers at all.
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: patterns
spec:
  selector:
    app.kubernetes.io/name: inventory-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: grpc
      port: 50051
      targetPort: 50051
