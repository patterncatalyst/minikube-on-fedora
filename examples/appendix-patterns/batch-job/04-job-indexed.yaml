# An Indexed Job: 3 completions, 3 in parallel, completionMode: Indexed. The
# kubelet injects JOB_COMPLETION_INDEX into every Pod automatically; each
# Pod reads a disjoint slice of shipment_events (id modulo 3) and writes its
# own report-<index>.csv — cooperative partitioning, not redundant copies.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: shipping-report-indexed-
  namespace: patterns
  labels:
    app.kubernetes.io/name: shipping-report-indexed
spec:
  completionMode: Indexed
  completions: 3
  parallelism: 3
  backoffLimit: 4
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shipping-report-indexed
    spec:
      restartPolicy: Never
      containers:
        - name: shipping-report
          image: shipping-report:v1
          imagePullPolicy: Never
          args: ["report"]
          env:
            - name: PG_HOST
              value: patterns-postgres.patterns.svc.cluster.local
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: password
            - name: PG_DATABASE
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: dbname
            - name: PARTITION_COUNT
              value: "3"
          volumeMounts:
            - name: reports
              mountPath: /var/lib/shipping-reports
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 192Mi
      volumes:
        - name: reports
          persistentVolumeClaim:
            claimName: shipping-reports-data
