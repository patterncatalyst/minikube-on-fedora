[project]
name = "shipping-report"
version = "0.1.0"
description = "Net-new BatchJob/PeriodicJob runner for the Kubernetes patterns appendix: reads shipment rows and writes a CSV report to a PVC."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.15.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.8.0"]

[tool.ruff]
line-length = 100
