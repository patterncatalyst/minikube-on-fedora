# notification-service with its real Alembic migration as an init container
# (the same wiring as the §17 capstone's Helm chart, reproduced here as plain
# manifests). The init container runs `alembic upgrade head` against the same
# image, so the `notifications` schema and table exist before the main
# container's first line of Python ever runs — the app issues no DDL of its
# own (CAP-021 in the capstone).
#
# Apply this Deployment BEFORE 00-postgres.yaml exists (see the chapter and
# this directory's README) to see the init container itself fail and retry:
# with no Postgres to connect to, `alembic upgrade head` exits non-zero
# immediately (env.py has no retry loop), and the kubelet restarts the init
# container on backoff while the main container sits in Waiting:
# PodInitializing. KAFKA_BOOTSTRAP is deliberately left pointing at nothing
# reachable — this example is scoped to the init-container ordering contract,
# not a live Kafka pipeline, same scoping the Managed Lifecycle chapter uses
# for this same service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: patterns
  labels:
    app.kubernetes.io/name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
    spec:
      initContainers:
        - name: migrate
          image: notification-service:v1
          imagePullPolicy: Never
          workingDir: /opt/app-root/src
          command: ["alembic", "upgrade", "head"]
          env:
            - name: SERVICE_SCHEMA
              value: notifications
            - name: PG_HOST
              value: patterns-postgres.patterns.svc.cluster.local
            - name: PG_PORT
              value: "5432"
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: password
            - name: PG_DATABASE
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: dbname
      containers:
        - name: notification-service
          image: notification-service:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_SCHEMA
              value: notifications
            - name: PG_HOST
              value: patterns-postgres.patterns.svc.cluster.local
            - name: PG_PORT
              value: "5432"
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: password
            - name: PG_DATABASE
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: dbname
            - name: KAFKA_BOOTSTRAP
              value: "kafka.invalid:9092"
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: patterns
spec:
  selector:
    app.kubernetes.io/name: notification-service
  ports:
    - port: 80
      targetPort: 8080
