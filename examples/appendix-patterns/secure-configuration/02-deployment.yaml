# inventory-service, consuming inventory-db-credentials two ways at once: as
# env vars (PG_USER/PG_PASSWORD/PG_DATABASE, the ordinary path) and as a
# 0400-mode mounted file at /etc/inventory/credentials (the narrower-exposure
# path this chapter's prose covers). Redundant by design, to make both
# consumption modes inspectable on the same running Pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: patterns
  labels:
    app.kubernetes.io/name: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: inventory-service:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 50051
          env:
            - name: SERVICE_SCHEMA
              value: inventory
            - name: PG_HOST
              value: patterns-postgres.patterns.svc.cluster.local
            - name: PG_PORT
              value: "5432"
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: inventory-db-credentials
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inventory-db-credentials
                  key: password
            - name: PG_DATABASE
              valueFrom:
                secretKeyRef:
                  name: inventory-db-credentials
                  key: dbname
          volumeMounts:
            - name: db-credentials
              mountPath: /etc/inventory/credentials
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: db-credentials
          secret:
            secretName: inventory-db-credentials
            # 0440 (owner+group read), not 0400: projected volume files are
            # always owned by root:root, and this container runs as a
            # non-root UID (the UBI image default) whose group is 0/root.
            # 0400 would make the file unreadable by the app itself
            # (Permission denied) since the app's UID never matches root;
            # 0440 still blocks world and every other group while matching
            # the container's own gid. Same fix as the Configuration
            # Resource example.
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: patterns
spec:
  selector:
    app.kubernetes.io/name: inventory-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: grpc
      port: 50051
      targetPort: 50051
