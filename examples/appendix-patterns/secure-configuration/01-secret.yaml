# inventory-service's own, distinctly named credential, rather than reusing
# patterns-postgres-app the way this appendix's other examples do. This
# disposable Postgres only recognizes one role, so the values here match
# patterns-postgres-app's; a real cluster would give inventory-service a
# Postgres role scoped to only the inventory schema. The pattern this chapter
# demonstrates: each service owning a differently named Secret, not sharing
# one across every service, holds regardless of whether the database behind
# it happens to use one shared role or many.
#
# stringData takes plain text at creation and lets the API server do the
# base64 encoding; kubectl get -o yaml shows the encoded form afterward.
apiVersion: v1
kind: Secret
metadata:
  name: inventory-db-credentials
  namespace: patterns
type: Opaque
stringData:
  username: capstone_app
  password: changeme
  dbname: capstone
