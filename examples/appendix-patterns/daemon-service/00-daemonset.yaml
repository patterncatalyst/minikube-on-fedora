# node-collector: a per-node log/metrics collector running beside the
# shipping services. No real observability backend behind it (that's out of
# scope for this pattern); it mounts the node's own /var/log read-only and
# logs a per-node summary line every 15s, which is enough to show a DaemonSet
# running exactly once per node and reading node-local state no single Pod
# could see.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-collector
  namespace: patterns
  labels:
    app.kubernetes.io/name: node-collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-collector
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-collector
    spec:
      # DaemonSets run on every schedulable node by default, but a tainted
      # control-plane node still repels them like any other Pod unless they
      # carry a matching toleration; infrastructure daemons are exactly the
      # workload that usually needs one.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: node-collector
          image: registry.access.redhat.com/ubi10/ubi-minimal:10.2-1792742351
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - "sh"
            - "-c"
            - |
              while true; do
                count=$(find /host-var-log/pods -maxdepth 1 -mindepth 1 -type d 2>/dev/null | wc -l)
                echo "node=${NODE_NAME} pod-log-dirs=${count}"
                sleep 15
              done
          volumeMounts:
            - name: varlog
              mountPath: /host-var-log
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
