# notification-service with postStart/preStop hooks and a terminationGrace-
# PeriodSeconds sized to cover both. KAFKA_BOOTSTRAP is left pointing at
# nothing reachable: this example is scoped to the container lifecycle
# contract (hooks, SIGTERM, grace period), not a live Kafka pipeline, so there
# is no Strimzi install on the mof-patterns profile. The background consumer
# task logs one failed connection attempt and exits; /health and /healthz are
# unaffected, since both depend only on the process and on Postgres.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: patterns
  labels:
    app.kubernetes.io/name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
    spec:
      # Long enough for the preStop sleep (10s) plus the app's own shutdown
      # (near-instant: cancel the consumer task, dispose the DB pool).
      terminationGracePeriodSeconds: 30
      containers:
        - name: notification-service
          image: notification-service:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_SCHEMA
              value: notifications
            - name: PG_HOST
              value: patterns-postgres.patterns.svc.cluster.local
            - name: PG_PORT
              value: "5432"
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: password
            - name: PG_DATABASE
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: dbname
            - name: KAFKA_BOOTSTRAP
              value: "kafka.invalid:9092"
          lifecycle:
            # Simulates warm-up work before the container is considered
            # started; the kubelet holds probes until this exits.
            postStart:
              exec:
                command: ["sh", "-c", "date > /tmp/managed-lifecycle-ready"]
            # Simulates endpoint-removal propagation delay: gives the Service
            # time to stop sending new requests here before SIGTERM arrives.
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: patterns
spec:
  selector:
    app.kubernetes.io/name: notification-service
  ports:
    - port: 80
      targetPort: 8080
