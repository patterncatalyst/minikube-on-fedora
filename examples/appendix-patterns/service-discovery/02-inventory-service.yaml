apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: patterns
  labels:
    app.kubernetes.io/name: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: inventory-service:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 50051
          env:
            - name: SERVICE_SCHEMA
              value: inventory
            - name: PG_HOST
              value: patterns-postgres.patterns.svc.cluster.local
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: password
            - name: PG_DATABASE
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: dbname
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
# NodePort: everything ClusterIP gives, plus the same port opened on every
# node's own IP, reachable from outside the cluster without an Ingress or a
# cloud load balancer in front of it.
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: patterns
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: inventory-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30180
    - name: grpc
      port: 50051
      targetPort: 50051
