# graphql-gateway reaches both services by DNS name alone — order-service
# over REST, inventory-service over gRPC — never by Pod IP, which is the
# entire point of giving every workload a Service in front of it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql-gateway
  namespace: patterns
  labels:
    app.kubernetes.io/name: graphql-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: graphql-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphql-gateway
    spec:
      containers:
        - name: graphql-gateway
          image: graphql-gateway:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ORDER_REST_URL
              value: http://order-service
            - name: INVENTORY_GRPC_ADDR
              value: inventory-service:50051
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
# LoadBalancer: on a real cloud this provisions an external load balancer
# with its own public IP; on minikube, `minikube tunnel` simulates one by
# routing a local address to the Service, since there's no cloud provider
# underneath to provision anything.
apiVersion: v1
kind: Service
metadata:
  name: graphql-gateway
  namespace: patterns
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: graphql-gateway
  ports:
    - port: 80
      targetPort: 8080
