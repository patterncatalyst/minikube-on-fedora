# shipping-service, unmodified, with NO Postgres-related environment
# variables at all. Its own config.py already defaults PG_HOST to
# 127.0.0.1:5432 and the Postgres user/password/database to the exact values
# 00-postgres.yaml's Secret uses — defaults written for a local ambassador,
# per the comment already in that file. The ambassador sidecar is a plain TCP
# proxy: it forwards raw bytes between 127.0.0.1:5432 and the real
# patterns-postgres Service without ever parsing the Postgres wire protocol,
# so it needs no database credentials of its own, only the upstream address.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-service
  namespace: patterns
  labels:
    app.kubernetes.io/name: shipping-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shipping-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shipping-service
    spec:
      containers:
        - name: shipping-service
          image: shipping-service:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
        - name: postgres-ambassador
          image: registry.access.redhat.com/ubi10/python-314-minimal:10.2-1791464217
          command: ["python3", "-c"]
          args:
            - |
              import asyncio
              import os

              UPSTREAM_HOST = os.environ.get(
                  "UPSTREAM_HOST", "patterns-postgres.patterns.svc.cluster.local"
              )
              UPSTREAM_PORT = int(os.environ.get("UPSTREAM_PORT", "5432"))

              async def pipe(reader, writer):
                  try:
                      while True:
                          data = await reader.read(4096)
                          if not data:
                              break
                          writer.write(data)
                          await writer.drain()
                  finally:
                      writer.close()

              async def handle(client_reader, client_writer):
                  try:
                      server_reader, server_writer = await asyncio.open_connection(
                          UPSTREAM_HOST, UPSTREAM_PORT
                      )
                  except OSError:
                      client_writer.close()
                      return
                  await asyncio.gather(
                      pipe(client_reader, server_writer),
                      pipe(server_reader, client_writer),
                  )

              async def main():
                  server = await asyncio.start_server(handle, "127.0.0.1", 5432)
                  async with server:
                      await server.serve_forever()

              asyncio.run(main())
          env:
            # Defaults to the real patterns-postgres Service, baked into the
            # script above. Overriding UPSTREAM_HOST here (see the README) is
            # how the chapter breaks the connection without touching
            # shipping-service's own container at all.
            - name: UPSTREAM_HOST
              value: patterns-postgres.patterns.svc.cluster.local
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shipping-service
  namespace: patterns
spec:
  selector:
    app.kubernetes.io/name: shipping-service
  ports:
    - port: 80
      targetPort: 8080
