# payment-service, with the ConfigurationResource pattern applied: the same
# ConfigMap and the same Secret each reach the container two ways:
# envFrom bulk-exposes every valid key as an environment variable, and a
# volumeMount delivers a file for whatever that resource's remaining key
# doesn't fit as an env var (or shouldn't be one).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: patterns
  labels:
    app.kubernetes.io/name: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-service
    spec:
      containers:
        - name: payment-service
          image: payment-service:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            # Bulk-exposes service_schema, pg_host, pg_port. payment-service.conf
            # is skipped (invalid env var name); see 01-configmap.yaml.
            - configMapRef:
                name: payment-config
            # Bulk-exposes pg_user, pg_password, pg_database.
            - secretRef:
                name: payment-pg-credentials
          volumeMounts:
            # The ConfigMap's one non-env-shaped key, as a file.
            - name: payment-config-file
              mountPath: /config/app
              readOnly: true
            # The Secret's password, also as a file: a process that reads a
            # credential from a path (instead of its own environment) never
            # inherits it into every child process the way an env var does,
            # and the file's own permissions add a second, independent gate.
            - name: payment-pg-password-file
              mountPath: /config/secrets
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: payment-config-file
          configMap:
            name: payment-config
            items:
              - key: payment-service.conf
                path: payment-service.conf
            # 0440 (owner+group read), not 0400: projected volume files are
            # always owned by root:root, and this container runs as a
            # non-root UID (the UBI image default) whose group is 0/root.
            # 0400 would make the file unreadable by the app itself
            # (Permission denied) since the app's UID never matches root;
            # 0440 still blocks world and every other group while matching
            # the container's own gid.
            defaultMode: 0440
        - name: payment-pg-password-file
          secret:
            secretName: payment-pg-credentials
            items:
              - key: pg_password
                path: pg_password
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: patterns
spec:
  selector:
    app.kubernetes.io/name: payment-service
  ports:
    - port: 80
      targetPort: 8080
