# The same shipping-report runner from the Batch Job chapter, wrapped in a
# CronJob instead of created by hand. Every firing produces one full report,
# tagged with that run's own Pod name so successive firings never overwrite
# each other's files.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: shipping-report
  namespace: patterns
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: shipping-report
        spec:
          restartPolicy: OnFailure
          containers:
            - name: shipping-report
              image: shipping-report:v1
              imagePullPolicy: Never
              args: ["report"]
              env:
                - name: PG_HOST
                  value: patterns-postgres.patterns.svc.cluster.local
                - name: PG_USER
                  valueFrom:
                    secretKeyRef:
                      name: patterns-postgres-app
                      key: username
                - name: PG_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: patterns-postgres-app
                      key: password
                - name: PG_DATABASE
                  valueFrom:
                    secretKeyRef:
                      name: patterns-postgres-app
                      key: dbname
                - name: PARTITION_COUNT
                  value: "1"
                - name: REPORT_TAG
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
              volumeMounts:
                - name: reports
                  mountPath: /var/lib/shipping-reports
              resources:
                requests:
                  cpu: 50m
                  memory: 96Mi
                limits:
                  memory: 192Mi
          volumes:
            - name: reports
              persistentVolumeClaim:
                claimName: shipping-reports-data
