# inventory-service, with the ConfigurationTemplate pattern applied: an init
# container renders app.conf.tmpl against the dev overlay (envFrom below) and
# writes the result to a shared emptyDir, before the main container starts.
# inventory-service's own runtime config (SERVICE_SCHEMA, PG_*) is unchanged
# and still arrives as plain env vars: this pattern is for a config shape a
# flat env var can't express, not a replacement for EnvVarConfiguration.
#
# Swap to the production overlay by changing configMapRef.name below from
# inventory-dev-overlay to inventory-prod-overlay and recreating the Pod: the
# init container only runs once, at Pod creation, so a running Pod never
# re-renders on its own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: patterns
  labels:
    app.kubernetes.io/name: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-service
    spec:
      initContainers:
        - name: render-config
          image: registry.access.redhat.com/ubi10/ubi-minimal:latest
          command:
            - sh
            - -c
            - |
              sed -e "s/__ENV_LABEL__/${ENV_LABEL}/" -e "s/__LOG_LEVEL__/${LOG_LEVEL}/" \
                /templates/app.conf.tmpl > /rendered/app.conf
          envFrom:
            - configMapRef:
                name: inventory-dev-overlay
          volumeMounts:
            - name: template
              mountPath: /templates
              readOnly: true
            - name: rendered
              mountPath: /rendered
      containers:
        - name: inventory-service
          image: inventory-service:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_SCHEMA
              value: inventory
            - name: PG_HOST
              value: patterns-postgres.patterns.svc.cluster.local
            - name: PG_PORT
              value: "5432"
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: password
            - name: PG_DATABASE
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: dbname
          volumeMounts:
            # The file the init container rendered, read-only from here on.
            - name: rendered
              mountPath: /config/app
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: template
          configMap:
            name: inventory-template
        - name: rendered
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: patterns
spec:
  selector:
    app.kubernetes.io/name: inventory-service
  ports:
    - port: 80
      targetPort: 8080
