# graphql-gateway, starting at replicas: 0. The HTTPScaledObject in
# 05-gateway-httpscaledobject.yaml takes ownership of this count the moment
# it's applied: KEDA generates an HPA behind the scenes wired to its own
# external metrics, and that HPA (not a human, not this Deployment's own
# spec) decides when zero stops being the right number.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql-gateway
  namespace: patterns
  labels:
    app.kubernetes.io/name: graphql-gateway
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: graphql-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphql-gateway
    spec:
      containers:
        - name: graphql-gateway
          image: graphql-gateway:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          # This chapter only exercises /health and /healthz through the KEDA
          # HTTP add-on's interceptor, never a real GraphQL query, so
          # ORDER_REST_URL/INVENTORY_GRPC_ADDR are left at their defaults
          # rather than pointed at services this namespace doesn't deploy.
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: graphql-gateway
  namespace: patterns
spec:
  selector:
    app.kubernetes.io/name: graphql-gateway
  ports:
    - port: 80
      targetPort: 8080
