# HorizontalPodAutoscaler: reads CPU utilization from metrics-server (enabled
# by setup-patterns-profile.sh) and scales shipping-service's replica count
# between 1 and 5 to hold average CPU at 50% of its 100m request.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shipping-service
  namespace: patterns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shipping-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
