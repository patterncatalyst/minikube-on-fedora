# shipping-service sized for HPA and VPA: a CPU request is mandatory for HPA
# to compute a utilization percentage at all (no request, no denominator), and
# VPA reads this same request as its own starting point for recommendations.
# A single replica to start: both autoscalers can only demonstrate their job
# by changing this number, so it shouldn't already be high.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-service
  namespace: patterns
  labels:
    app.kubernetes.io/name: shipping-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shipping-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shipping-service
    spec:
      containers:
        - name: shipping-service
          image: shipping-service:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_SCHEMA
              value: shipping
            - name: PG_HOST
              value: patterns-postgres.patterns.svc.cluster.local
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: password
            - name: PG_DATABASE
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: dbname
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: shipping-service
  namespace: patterns
spec:
  selector:
    app.kubernetes.io/name: shipping-service
  ports:
    - port: 80
      targetPort: 8080
