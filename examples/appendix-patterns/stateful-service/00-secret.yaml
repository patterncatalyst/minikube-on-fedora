# Credentials for the shipment-archive StatefulSet's disposable Postgres
# instances. Not the CloudNativePG-managed capstone cluster; this is three
# independent, non-replicating postgres:17-alpine instances standing in for
# a per-zone shipment archive, purely to exercise StatefulSet mechanics.
apiVersion: v1
kind: Secret
metadata:
  name: shipment-archive-app
  namespace: patterns
type: Opaque
stringData:
  username: capstone_app
  password: changeme
  dbname: archive
