# payment-service at three interchangeable replicas: no volumeClaimTemplates,
# no per-pod identity, nothing that ties a request to a specific Pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: patterns
  labels:
    app.kubernetes.io/name: payment-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-service
    spec:
      containers:
        - name: payment-service
          image: payment-service:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_SCHEMA
              value: payments
            - name: PG_HOST
              value: patterns-postgres.patterns.svc.cluster.local
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: password
            - name: PG_DATABASE
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: dbname
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: patterns
spec:
  selector:
    app.kubernetes.io/name: payment-service
  ports:
    - port: 80
      targetPort: 8080
