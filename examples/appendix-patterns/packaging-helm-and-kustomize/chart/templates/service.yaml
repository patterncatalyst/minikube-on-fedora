apiVersion: v1
kind: Service
metadata:
  name: {{ include "shipping-chart.fullname" . }}
  namespace: patterns
  labels:
    {{- include "shipping-chart.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "shipping-chart.selectorLabels" . | nindent 4 }}
  ports:
    - port: 80
      targetPort: http
