apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shipping-chart.fullname" . }}
  namespace: patterns
  labels:
    {{- include "shipping-chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "shipping-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shipping-chart.selectorLabels" . | nindent 8 }}
      annotations:
        # Rotates when the rendered ConfigMap changes, so an upgrade that
        # only changes values.schema rolls the Pods even though nothing in
        # the Deployment's own template literally changed.
        checksum/configmap: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: shipping-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: {{ include "shipping-chart.fullname" . }}-config
                  key: schema
            - name: PG_HOST
              value: {{ .Values.postgres.host | quote }}
            - name: PG_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secretName }}
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secretName }}
                  key: password
            - name: PG_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secretName }}
                  key: dbname
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
