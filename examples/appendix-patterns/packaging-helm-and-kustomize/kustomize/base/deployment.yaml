apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-kustomize
  labels:
    app.kubernetes.io/name: shipping-kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shipping-kustomize
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shipping-kustomize
    spec:
      containers:
        - name: shipping-service
          image: shipping-service:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: shipping-kustomize-config
                  key: schema
            - name: PG_HOST
              value: patterns-postgres.patterns.svc.cluster.local
            - name: PG_PORT
              value: "5432"
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: password
            - name: PG_DATABASE
              valueFrom:
                secretKeyRef:
                  name: patterns-postgres-app
                  key: dbname
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
