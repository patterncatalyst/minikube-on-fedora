# dev overlay: one replica, a tight resource profile cheap enough to run
# alongside everything else on a laptop-sized cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-kustomize
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: shipping-service
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
