# config/default/kustomization.yaml: the single entry point that deploys the
# ShippingPolicy CRD, the operator's RBAC (ServiceAccount/Role/RoleBinding),
# and the operator's own Deployment together into the patterns namespace.
#
#   kustomize build config/default | kubectl --context mof-patterns apply -f -
namespace: patterns

resources:
  - ../crd
  - ../rbac
  - ../manager
