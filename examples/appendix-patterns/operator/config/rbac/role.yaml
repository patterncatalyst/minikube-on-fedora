# role.yaml — generated by controller-gen from the +kubebuilder:rbac markers
# on ShippingPolicyReconciler, then hand-edited from a ClusterRole to a
# namespaced Role: this operator only ever reconciles ShippingPolicy objects
# in the `patterns` namespace (chapter 25, Operator), so a Role scoped to
# that one namespace is least privilege. Regenerate the rule list with:
#   controller-gen rbac:roleName=shipping-policy-operator paths=./... \
#     output:rbac:artifacts:config=config/rbac
# and re-apply this namespace edit; controller-gen itself only emits
# ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shipping-policy-operator
  namespace: patterns
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - shipping.patterncatalyst.io
    resources:
      - shippingpolicies
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - shipping.patterncatalyst.io
    resources:
      - shippingpolicies/status
    verbs:
      - get
      - patch
      - update
