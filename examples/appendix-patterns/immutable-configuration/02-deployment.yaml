# graphql-gateway, referencing gateway-config-v1. The gateway is stateless:
# no Postgres, no schema, so this example needs nothing beyond the
# ConfigMap and this Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql-gateway
  namespace: patterns
  labels:
    app.kubernetes.io/name: graphql-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: graphql-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphql-gateway
    spec:
      containers:
        - name: graphql-gateway
          image: graphql-gateway:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: gateway-config-v1
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: graphql-gateway
  namespace: patterns
spec:
  selector:
    app.kubernetes.io/name: graphql-gateway
  ports:
    - port: 80
      targetPort: 8080
