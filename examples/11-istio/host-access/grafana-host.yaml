# examples/11-istio/host-access/grafana-host.yaml
#
# Companion NodePort Service owned by this repo. Reaches Grafana (apply samples/addons/grafana.yaml first).
# It selects the same Pods as the upstream Service, so re-applying the
# addon or running istioctl install never reverts it. Published by the
# istio profile as 127.0.0.1:3000 (see ISTIO_PORTS in scripts/lib/_helpers.sh).
# Selector: verified against samples/addons/grafana.yaml in the Istio release
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-host
  namespace: istio-system
  labels:
    app.kubernetes.io/managed-by: minikube-on-fedora
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300
      protocol: TCP
