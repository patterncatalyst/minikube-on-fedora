# examples/11-istio/host-access/kiali-host.yaml
#
# Companion NodePort Service owned by this repo. Reaches Kiali (apply samples/addons/kiali.yaml first).
# It selects the same Pods as the upstream Service, so re-applying the
# addon or running istioctl install never reverts it. Published by the
# istio profile as 127.0.0.1:20001 (see ISTIO_PORTS in scripts/lib/_helpers.sh).
# Selector: verified against samples/addons/kiali.yaml in the Istio release
---
apiVersion: v1
kind: Service
metadata:
  name: kiali-host
  namespace: istio-system
  labels:
    app.kubernetes.io/managed-by: minikube-on-fedora
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kiali
    app.kubernetes.io/instance: kiali
  ports:
    - name: http
      port: 20001
      targetPort: 20001
      nodePort: 30201
      protocol: TCP
