# examples/17-capstone/host-access/kiali-host.yaml
#
# Companion NodePort Service owned by this repo. Reaches the Kiali console.
# It selects the same Pods as the upstream Service, so helm upgrade,
# istioctl install or an addon re-apply never reverts it. Published by the
# mof-capstone profile as 127.0.0.1:20001 (see CAPSTONE_PORTS in
# scripts/lib/env.sh).
# Selector: Istio samples/addons/kiali.yaml Service (Kiali v2.31.0, Istio 1.31.1).
#   verify live: kubectl --context mof-capstone get svc -n istio-system kiali -o jsonpath='{.spec.selector}'
---
apiVersion: v1
kind: Service
metadata:
  name: kiali-host
  namespace: istio-system
  labels:
    app.kubernetes.io/managed-by: minikube-on-fedora
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kiali
    app.kubernetes.io/instance: kiali
  ports:
    - name: http
      port: 20001
      targetPort: 20001
      nodePort: 30201
      protocol: TCP
