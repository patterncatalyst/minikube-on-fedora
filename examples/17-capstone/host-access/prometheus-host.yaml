# examples/17-capstone/host-access/prometheus-host.yaml
#
# Companion NodePort Service owned by this repo. Reaches the Prometheus server UI/API.
# It selects the same Pods as the upstream Service, so helm upgrade,
# istioctl install or an addon re-apply never reverts it. Published by the
# mof-capstone profile as 127.0.0.1:9090 (see CAPSTONE_PORTS in
# scripts/lib/env.sh).
# Selector: prometheus-community/prometheus 29.36.1 (helm template, release prometheus, observability/prometheus-values.yaml); server container port 9090.
#   verify live: kubectl --context mof-capstone get svc -n observability prometheus-server -o jsonpath='{.spec.selector}'
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-host
  namespace: observability
  labels:
    app.kubernetes.io/managed-by: minikube-on-fedora
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: prometheus
  ports:
    - name: http
      port: 80
      targetPort: 9090
      nodePort: 30090
      protocol: TCP
