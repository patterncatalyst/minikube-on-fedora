# examples/17-capstone/host-access/openmetadata-host.yaml
#
# Companion NodePort Service owned by this repo. Reaches the OpenMetadata UI/API.
# It selects the same Pods as the upstream Service, so helm upgrade,
# istioctl install or an addon re-apply never reverts it. Published by the
# mof-capstone profile as 127.0.0.1:8585 (see CAPSTONE_PORTS in
# scripts/lib/env.sh).
# Selector: open-metadata/openmetadata 1.12.8 (helm template, release openmetadata, openmetadata/om-app-values.yaml); namespace capstone (setup-openmetadata.sh NS).
#   verify live: kubectl --context mof-capstone get svc -n capstone openmetadata -o jsonpath='{.spec.selector}'
---
apiVersion: v1
kind: Service
metadata:
  name: openmetadata-host
  namespace: capstone
  labels:
    app.kubernetes.io/managed-by: minikube-on-fedora
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: openmetadata
    app.kubernetes.io/instance: openmetadata
  ports:
    - name: http
      port: 8585
      targetPort: 8585
      nodePort: 30585
      protocol: TCP
