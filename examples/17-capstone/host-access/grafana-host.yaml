# examples/17-capstone/host-access/grafana-host.yaml
#
# Companion NodePort Service owned by this repo. Reaches Grafana.
# It selects the same Pods as the upstream Service, so helm upgrade,
# istioctl install or an addon re-apply never reverts it. Published by the
# mof-capstone profile as 127.0.0.1:3000 (see CAPSTONE_PORTS in
# scripts/lib/env.sh).
# Selector: grafana-community/grafana 13.4.0 (helm template, release grafana, observability/grafana-values.yaml); container port 3000.
#   verify live: kubectl --context mof-capstone get svc -n observability grafana -o jsonpath='{.spec.selector}'
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-host
  namespace: observability
  labels:
    app.kubernetes.io/managed-by: minikube-on-fedora
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: grafana
  ports:
    - name: http
      port: 80
      targetPort: 3000
      nodePort: 30300
      protocol: TCP
