# examples/17-capstone/host-access/tempo-host.yaml
#
# Companion NodePort Service owned by this repo. Reaches Tempo: the query API (3200) and the OTLP/HTTP receiver (4318).
# It selects the same Pods as the upstream Service, so helm upgrade,
# istioctl install or an addon re-apply never reverts it. Published by the
# mof-capstone profile as 127.0.0.1:3200 and 127.0.0.1:4318 (see CAPSTONE_PORTS in
# scripts/lib/env.sh).
# Selector: grafana-community/tempo 3.1.0 (helm template, release tempo, observability/tempo-values.yaml).
#   verify live: kubectl --context mof-capstone get svc -n observability tempo -o jsonpath='{.spec.selector}'
---
apiVersion: v1
kind: Service
metadata:
  name: tempo-host
  namespace: observability
  labels:
    app.kubernetes.io/managed-by: minikube-on-fedora
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/instance: tempo
  ports:
    - name: http
      port: 3200
      targetPort: 3200
      nodePort: 30320
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      nodePort: 30418
      protocol: TCP
