# Postgres subchart values: the CloudNativePG Cluster CR configuration.
# The operator (installed separately) reconciles this into actual Postgres
# pods, services, and secrets.

cluster:
  name: capstone-postgres
  instances: 1                # single-instance dev cluster (NOT production-shaped)
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie"   # pinned: the CNPG standard image, newest 18.x
  storage:
    size: 5Gi                 # starter size; bump for sustained multi-service use
  # The application database the operator bootstraps. Each service uses its
  # own SCHEMA within this database, not its own database.
  database: capstone
  owner: capstone_app
  # Resource requests/limits for the Postgres pod itself.
  # 512Mi was too tight: Postgres + the CNPG instance-manager + startup
  # crash-recovery (WAL replay) OOM-killed at that ceiling, especially after an
  # unclean restart. A database is not a tiny FastAPI service (the per-service
  # memory calibration does not apply here); give it real headroom.
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 2Gi
