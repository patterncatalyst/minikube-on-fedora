# shipping-service subchart values.

replicas: 1

image:
  # Bare name: build-image.sh builds with Docker and loads it into the
  # mof-capstone profile (minikube image load); nothing is pulled.
  repository: shipping-service
  tag: v1
  # Never: the image only exists in the node via image load. build-image.sh
  # runs kubectl rollout restart after each load so pods pick up a rebuild.
  pullPolicy: Never

service:
  # NodePort published by the mof-capstone profile (CAPSTONE_PORTS in
  # scripts/lib/env.sh).
  type: NodePort
  nodePort: 30184
  port: 80
  targetPort: 8080

# Postgres connection. The CloudNativePG operator generates a Secret named
# "<cluster>-app" holding the app user's credentials; we reference it by key.
postgres:
  clusterName: capstone-postgres
  appSecret: capstone-postgres-app
  schema: shipping

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 512Mi

# /health is liveness; /healthz is readiness (checks Postgres).
probes:
  # r28: startupProbe gates liveness/readiness until the app has finished booting.
  # Python services (imports + gRPC channels + schema build) can take 10-30s; a 5s
  # liveness initialDelay was killing them mid-boot (and the gateway OOM-looped at
  # 256Mi). 30 x 2s = 60s startup grace.
  startup:
    path: /health
    failureThreshold: 30
    periodSeconds: 2
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 5
