apiVersion: v2
name: capstone
description: "Capstone data-mesh umbrella chart: orchestrates platform components (Strimzi, KEDA, Istio, observability, Apicurio, OpenMetadata, Prefect, Postgres) and the five domain services (order, inventory, payment, shipping, notification)."
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - data-mesh
  - tutorial
  - capstone
  - minikube
  - fedora
sources:
  - https://github.com/patterncatalyst/minikube-on-fedora

# Subcharts: order-service, inventory-service, payment-service,
# shipping-service, notification-service, graphql-gateway, strimzi-cluster
# (the Kafka cluster CR, not the operator), apicurio, keda-scaling,
# observability (OTEL Collector, Prometheus, Tempo, Grafana), openmetadata,
# and prefect. values.yaml defines feature flags for every component so the
# deploy can be staged.
#
# Strimzi, KEDA, and Istio control planes are installed separately via
# their own helm releases (consistent with §11/§12); they are platform
# infrastructure, not part of this umbrella chart.
